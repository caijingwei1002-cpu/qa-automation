name: Repository validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate structure and daily plan
        run: python tools/validate_repo.py
      - name: Install tooling test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test learning workflow and service preflight
        run: python -m pytest tools -q
      - name: Check maintained Python style
        run: |
          python -m ruff check tools plugins test-projects/03-restful-booker-api test-projects/05-booker-platform
          python -m ruff format --check tools plugins test-projects/03-restful-booker-api test-projects/05-booker-platform
      - name: Test workbench with the local fake service
        run: python -m unittest discover -s workbench/tests -v
